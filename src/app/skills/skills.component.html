<section class="skills" id="skills" style='--primary-hue: {{backgroundHue()}}'>
    <h2 class="skills__section__title">My Skills</h2>
    <div class="skills__wrapper">
        
        @for(skillsCategory of skillsCategories; track skillsCategory) {
            <div class='skills__content {{skillsCategory.title.toLowerCase()}}'>
            <h3 class='skills__title {{skillsCategory.title.toLowerCase()}}'>
                    {{skillsCategory.title}}
                </h3>
                <div class="skills__list__grid">
                    @for(skills of skillsCategory.skills; track skills) {
                        <div class="skill__tile__wrapper">
                            <img src={{skills.imgSrc}} alt={{skills.alt}} class="skill__tile__image"/>
                            <p class="skill__tile__name">{{skills.title}}</p>
                        </div>
                    } 
                </div>
            </div>
        }
    </div>
</section>
