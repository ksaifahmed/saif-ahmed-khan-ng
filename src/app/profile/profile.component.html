<section class="hero" [class.active]="false">
    <div class="hero__wrapper">
      
      <div class="image__wrapper">
        <img src="/images/profilePicture.jpg" alt="profile" class="hero__image"/>
      </div>
      
      <div class="text__wrapper">
        <h2 class="hero__title">Saif Ahmed Khan</h2>
        <h3 class="hero__subtitle">Software Engineer</h3>
        <h3 class="hero__subtitle">C# | .NET Core</h3>
        <p class="hero__about">Veradigm</p>
        <p class="hero__about">Dhaka, Bangladesh</p>
