<section class="hero" [class.active]="hamburgerActive()" style='--primary-hue: {{backgroundHue()}}' >
    <div class="hero__wrapper">
      
      <div class="image__wrapper">
        <img src="/images/profilePicture.jpg" alt="profile" class="hero__image"/>
      </div>
      
      <div class="text__wrapper">
        <h2 class="hero__title">Saif Ahmed Khan</h2>
        <h3 class="hero__subtitle">Software Engineer</h3>
        <h3 class="hero__subtitle">C# | .NET Core | AWS | Angular</h3>
        
        <a rel="noreferrer" target="_blank" 
           href="https://veradigm.com" 
           class="hero__school__link">
          <p class="hero__school">
            Veradigm
          </p>
        </a>
        
        <p class="hero__about">Dhaka, Bangladesh</p>

        <app-pulsating-button 
            [buttonClickEvent]="doSth"
            [buttonText]="'Download CV'" 
            [padding]="'12px 20px 14px'"
            [margin]="'10px -3px'"
            [color]="'#fff'"
            [boxShadowColor]="'#FFC108'"
            [bgColor]="'#ff9800 !important'"
        />

      </div>
    </div>
  </section>
